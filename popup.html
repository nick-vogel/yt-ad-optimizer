<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h2>Mid-Roll Manager</h2>

    <div id="status">
      <span id="status-dot" class="checking"></span>
      <span id="status-text">Checking...</span>
    </div>

    <div class="tab-bar">
      <button class="tab active" data-tab="insert">Insert</button>
      <button class="tab" data-tab="cleanup">Cleanup</button>
    </div>

    <div id="tab-insert" class="tab-content active">
      <div class="control-group">
        <label for="insert-interval">Place an ad every N seconds</label>
        <input type="number" id="insert-interval" value="60" min="30" max="1800" step="15" />
      </div>

      <div class="control-group">
        <label for="insert-start">Start at (seconds)</label>
        <input type="number" id="insert-start" value="60" min="0" max="86400" step="15" />
      </div>

      <div class="control-group">
        <label for="insert-speed">Speed (ms)</label>
        <input type="number" id="insert-speed" value="50" min="50" max="2000" step="50" />
      </div>

      <div class="speed-hint">If your browser lags or placements drop, slow down by increasing the speed (ms) value.</div>
      <button id="insert-btn" disabled>Insert Ad Slots</button>
    </div>

    <div id="tab-cleanup" class="tab-content">
      <div class="control-group">
        <label for="interval">Min seconds between ads</label>
        <input type="number" id="interval" value="60" min="5" max="600" step="5" />
      </div>

      <div class="control-group">
        <label for="cleanup-speed">Speed (ms)</label>
        <input type="number" id="cleanup-speed" value="50" min="50" max="2000" step="50" />
      </div>

      <div class="speed-hint">If your browser lags or placements drop, slow down by increasing the speed (ms) value.</div>
      <button id="run-btn" disabled>Run Cleanup</button>
    </div>
    <div id="summary"></div>
    <div id="log-area"></div>

    <button id="done-btn">Done</button>

    <script src="popup.js"></script>
  </body>
</html>
